name: Build and Push Docker Image

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'    # match semantic version tags like v1.2.3
    paths-ignore:
      - README.md

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Determine Docker tags
      - name: Set Docker tags
        id: docker_tags
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Strip the "v" prefix from tag
            FULL="${GITHUB_REF#refs/tags/v}"   # e.g., 2.0.0
            MAJOR="${FULL%%.*}"               # 2
            MINOR="${FULL%.*}"                # 2.0
            LATEST_TAG=false
          else
            FULL="latest"
            MAJOR="latest"
            MINOR="latest"
            LATEST_TAG=true
          fi

          echo "full=$FULL" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      # 5. Build and push Docker images
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            markfeher/mycv:${{ steps.docker_tags.outputs.full }}
            markfeher/mycv:${{ steps.docker_tags.outputs.minor }}
            markfeher/mycv:${{ steps.docker_tags.outputs.major }}
            ${{ steps.docker_tags.outputs.latest_tag == 'true' && 'markfeher/mycv:latest' || '' }}

