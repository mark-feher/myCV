name: Docker Build & Push on Tag

on:
  push:
    tags:
      - '*'   # Trigger only on Git tags

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: markfeher/mycv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker tags from Git tag
        id: docker_tags
        run: |
          echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "LATEST_TAG=latest" >> $GITHUB_ENV
          echo "Docker tags will be: $IMAGE_TAG, latest"

      - name: Build Docker image
        run: |
          docker build \
            -t "${DOCKER_IMAGE}:${IMAGE_TAG}" \
            -t "${DOCKER_IMAGE}:${LATEST_TAG}" .

      - name: Push Docker image
        run: |
          docker push "${DOCKER_IMAGE}:${IMAGE_TAG}"
          docker push "${DOCKER_IMAGE}:${LATEST_TAG}"

